<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro — Portal de Socios | Talleres Filial Capital Federal</title>
<link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1EMSCiSC5Y9rK-DcL8rpYyc-2X_gdoj7_&sz=w64-h64-p">
<link rel="stylesheet" href="estilos.css">
</head>
<body class="fondo-banner">

<div class="encabezado">
  <p class="club">Talleres Filial Capital Federal</p>
  <h1>Registro de Socios</h1>
</div>

<div class="tarjeta">
  <div id="mensaje" class="mensaje"></div>

  <form id="formRegistro">
    <div class="fila-doble">
      <div class="campo">
        <label for="nombres">Nombres</label>
        <input type="text" id="nombres" required>
      </div>
      <div class="campo">
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" required>
      </div>
    </div>

    <div class="fila-doble">
      <div class="campo">
        <label for="dni">DNI</label>
        <input type="text" id="dni" required inputmode="numeric">
      </div>
      <div class="campo">
        <label for="fechaNac">Fecha de nacimiento</label>
        <input type="date" id="fechaNac" required>
      </div>
    </div>

    <div class="campo">
      <label for="numeroSocio">Número de socio</label>
      <input type="text" id="numeroSocio" required inputmode="numeric">
    </div>

    <div class="campo">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>

    <div class="campo">
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" required>
    </div>

    <div class="campo" id="campoPassword">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="new-password" minlength="6">
    </div>

    <div class="checkbox-fila">
      <input type="checkbox" id="novedades" checked>
      <label for="novedades">Quiero recibir novedades por email</label>
    </div>

    <button type="submit" class="principal" id="btnRegistrar">Crear mi cuenta</button>
  </form>

  <a href="login.html" class="enlace-secundario" id="enlaceLogin">¿Ya tenés cuenta? Iniciá sesión</a>
</div>

<script type="module">
import { supabase, URL_PORTAL, irConTokenPrellenado, volverSeguro } from './supabaseClient.js';

const form = document.getElementById('formRegistro');
const btnRegistrar = document.getElementById('btnRegistrar');
const mensaje = document.getElementById('mensaje');
const campoPassword = document.getElementById('campoPassword');
const inputPassword = document.getElementById('password');
const inputEmail = document.getElementById('email');
const enlaceLogin = document.getElementById('enlaceLogin');

let sesionGoogle = null;

const params = new URLSearchParams(window.location.search);

const volver = volverSeguro(params.get('volver'));
if (volver) {
  enlaceLogin.href = 'login.html?volver=' + encodeURIComponent(volver);
}

const esPopup = params.get('popup') === '1';

function mostrarError(texto, conBotonBaja = false) {
  mensaje.className = 'mensaje error';
  mensaje.innerHTML = texto + (conBotonBaja
    ? '<br><a class="boton-cartel" href="https://example.com">Ir al sitio de la filial</a>'
    : '');
}

function ocultarMensaje() {
  mensaje.className = 'mensaje';
  mensaje.innerHTML = '';
}

async function terminarConExito() {
  if (esPopup && window.opener) {
    try {
      if (volver) {
        // acá va la función que genera el token de un solo uso para pasar los datos del socio a otro sitio (no se incluye en el demo)
        const token = null;
        window.opener.postMessage({ tipo: 'login-socio-ok', volver, token: token || null }, window.location.origin);
      } else {
        window.opener.postMessage({ tipo: 'login-socio-ok' }, window.location.origin);
      }
    } catch (e) {
      console.error('terminarConExito: no se pudo avisar a la ventana de origen.', e);
    }
    window.close();
    return;
  }

  if (volver) {
    await irConTokenPrellenado(volver);
  } else {
    window.location.href = URL_PORTAL;
  }
}

async function revisarSesionGoogle() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    sesionGoogle = session;
    inputEmail.value = session.user.email || '';
    inputEmail.readOnly = true;
    campoPassword.style.display = 'none';
    inputPassword.required = false;
  } else {
    const emailPrecargado = params.get('email');
    if (emailPrecargado) inputEmail.value = emailPrecargado;
  }
}
revisarSesionGoogle();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  ocultarMensaje();
  btnRegistrar.disabled = true;
  btnRegistrar.textContent = 'Verificando...';

  const numeroSocio = document.getElementById('numeroSocio').value.trim();

  const { data: verificacion, error: errorVerificacion } = await supabase
    .rpc('verificar_socio', { p_numero_socio: numeroSocio })
    .single();

  if (errorVerificacion) {
    mostrarError('No pudimos verificar tu número de socio. Probá de nuevo en un momento.');
    resetBoton();
    return;
  }

  if (!verificacion.activo) {
    mostrarError('No encontramos tu número de socio asociado a la filial, o tu vínculo figura dado de baja.', true);
    resetBoton();
    return;
  }

  btnRegistrar.textContent = 'Creando cuenta...';

  let userId;
  const email = inputEmail.value.trim();

  if (sesionGoogle) {
    userId = sesionGoogle.user.id;
  } else {
    const password = inputPassword.value;
    const { data: dataSignUp, error: errorSignUp } = await supabase.auth.signUp({ email, password });

    if (errorSignUp) {
      mostrarError(errorSignUp.message.includes('already registered')
        ? 'Ese email ya tiene una cuenta creada. Iniciá sesión en vez de registrarte.'
        : 'No pudimos crear la cuenta: ' + errorSignUp.message);
      resetBoton();
      return;
    }
    userId = dataSignUp.user.id;
  }

  const { error: errorPerfil } = await supabase.from('perfiles').insert({
    id: userId,
    numero_socio: numeroSocio,
    nombres: document.getElementById('nombres').value.trim(),
    apellidos: document.getElementById('apellidos').value.trim(),
    dni: document.getElementById('dni').value.trim(),
    fecha_nacimiento: document.getElementById('fechaNac').value,
    telefono: document.getElementById('telefono').value.trim(),
    email: email,
    recibir_novedades: document.getElementById('novedades').checked
  });

  if (errorPerfil) {
    mostrarError('Creamos tu cuenta pero hubo un problema guardando tus datos. Contactanos por WhatsApp para resolverlo.', false);
    resetBoton();
    return;
  }

  mensaje.className = 'mensaje ok';
  mensaje.textContent = '¡Listo! Redirigiendo...';
  setTimeout(terminarConExito, 1200);

});

function resetBoton() {
  btnRegistrar.disabled = false;
  btnRegistrar.textContent = 'Crear mi cuenta';
}
</script>

</body>
</html>
